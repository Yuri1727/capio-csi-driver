apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: capio-tesi-cona
provisioner: capio.csi.k8s.io
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  workflowName: "demo"
  producerStep: "writer"
  consumerStep: "reader1,reader2,reader3"
  files: "shared.dat"
  commitRule: "on_close"
  # Optional: the CAPIO_DIR of this volume, i.e. the path pods must mount it
  # at and set CAPIO_DIR to. Defaults to /capio when omitted.
  # capioDir: "/data/demo"
