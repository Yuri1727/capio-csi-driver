apiVersion: v1
kind: Pod
metadata:
  name: capio-producer-multinode
  namespace: capio-tesi-cona
  labels:
    role: capio-demo-multinode
    component: producer
spec:
  restartPolicy: Never
  hostIPC: true
  hostPID: true
  imagePullSecrets:
    - name: ghcr-pull-secret
  containers:
    - name: producer
      image: ghcr.io/yuri1727/capio-csi-driver:v3.2
      imagePullPolicy: Always
      command: ["sh", "-c"]
      args:
        - |
          set -e
          echo "producer: waiting a moment so the consumer is up first..."
          sleep 10
          echo "producer: writing shared.dat"
          CAPIO_DIR=/capio CAPIO_WORKFLOW_NAME=mnode-e2e CAPIO_APP_NAME=writer \
            LD_PRELOAD=/usr/local/lib/libcapio_posix.so \
            sh -c 'echo "hello cross-node, via the driver, at $(date)" > /capio/shared.dat'
          echo "producer: done"
          sleep 3600
      volumeMounts:
        - name: shared
          mountPath: /capio
  volumes:
    - name: shared
      persistentVolumeClaim:
        claimName: capio-shared-pvc-multinode
