apiVersion: v1
kind: Pod
metadata:
  name: capio-consumer-mn3r-1
  namespace: capio-tesi-cona
  labels:
    role: capio-demo-mn3r
spec:
  restartPolicy: Never
  hostIPC: true
  hostPID: true
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              role: capio-demo-mn3r
              component: producer
          topologyKey: kubernetes.io/hostname
  imagePullSecrets:
    - name: ghcr-pull-secret
  containers:
    - name: consumer
      image: ghcr.io/yuri1727/capio-csi-driver:v3.1
      imagePullPolicy: Always
      command: ["sh", "-c"]
      args:
        - |
          echo "reader1 (local, same node as producer): waiting"
          CAPIO_DIR=/capio CAPIO_WORKFLOW_NAME=mnode-3r-e2e CAPIO_APP_NAME=reader1 \
            LD_PRELOAD=/usr/local/lib/libcapio_posix.so \
            cat /capio/shared.dat
          echo "reader1: done"
          sleep 3600
      volumeMounts:
        - name: shared
          mountPath: /capio
  volumes:
    - name: shared
      persistentVolumeClaim:
        claimName: capio-shared-pvc-multinode-3r
---
