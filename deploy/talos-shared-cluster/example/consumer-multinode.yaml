apiVersion: v1
kind: Pod
metadata:
  name: capio-consumer-multinode
  namespace: capio-tesi-cona
  labels:
    role: capio-demo-multinode
spec:
  restartPolicy: Never
  hostIPC: true
  hostPID: true
  nodeSelector:
    kubernetes.io/hostname: talos-worker-2
  imagePullSecrets:
    - name: ghcr-pull-secret
  containers:
    - name: consumer
      image: ghcr.io/yuri1727/capio-csi-driver:dev
      imagePullPolicy: Always
      command: ["sh", "-c"]
      args:
        - |
          echo "consumer: waiting for shared.dat (blocks until the producer closes it)"
          CAPIO_DIR=/capio CAPIO_WORKFLOW_NAME=mnode-e2e CAPIO_APP_NAME=reader1 \
            LD_PRELOAD=/usr/local/lib/libcapio_posix.so \
            cat /capio/shared.dat
          echo "consumer: done"
          sleep 3600
      volumeMounts:
        - name: shared
          mountPath: /capio
  volumes:
    - name: shared
      persistentVolumeClaim:
        claimName: capio-shared-pvc-multinode
