apiVersion: v1
kind: Pod
metadata:
  name: capio-consumer-1
  namespace: capio-tesi-cona
  labels:
    role: capio-demo
spec:
  restartPolicy: Never
  hostIPC: true
  imagePullSecrets:
    - name: ghcr-pull-secret
  containers:
    - name: consumer
      image: ghcr.io/yuri1727/capio-csi-driver:v3.1
      imagePullPolicy: Always
      command: ["sh", "-c"]
      args:
        - |
          echo "consumer-1: waiting for shared.dat (blocks until the producer closes it)"
          CAPIO_DIR=/capio CAPIO_WORKFLOW_NAME=demo-single CAPIO_APP_NAME=reader1 \
            LD_PRELOAD=/usr/local/lib/libcapio_posix.so \
            cat /capio/shared.dat
          echo "consumer-1: done"
          sleep 3600
      volumeMounts:
        - name: shared
          mountPath: /capio
  volumes:
    - name: shared
      persistentVolumeClaim:
        claimName: capio-shared-pvc-single
