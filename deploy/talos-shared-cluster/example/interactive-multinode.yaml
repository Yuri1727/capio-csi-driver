apiVersion: v1
kind: Pod
metadata:
  name: capio-shell-1
  namespace: capio-tesi-cona
  labels:
    role: capio-shell
spec:
  restartPolicy: Never
  hostIPC: true
  hostPID: true
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              role: capio-shell
          topologyKey: kubernetes.io/hostname
  imagePullSecrets:
    - name: ghcr-pull-secret
  containers:
    - name: shell
      image: ghcr.io/yuri1727/capio-csi-driver:v3.2
      imagePullPolicy: Always
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: shared
          mountPath: /capio
  volumes:
    - name: shared
      persistentVolumeClaim:
        claimName: capio-shared-pvc-multinode
