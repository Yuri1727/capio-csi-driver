apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Name referenced directly by pkg/capio/mpijob.go (sharedDiscoveryPVCName) -
  # keep in sync if renamed here.
  name: capio-discovery
  namespace: capio-tesi-cona
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: capio-nfs
  resources:
    requests:
      storage: 1Gi
