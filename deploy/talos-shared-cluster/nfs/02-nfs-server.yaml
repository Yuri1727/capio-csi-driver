apiVersion: apps/v1
kind: Deployment
metadata:
  name: capio-nfs-server
  namespace: capio-tesi-cona
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: capio-nfs-server
  template:
    metadata:
      labels:
        app: capio-nfs-server
    spec:
      # nfs-ganesha is a userspace NFS server (no in-kernel nfsd needed) -
      # tried itsthenetwork/nfs-server-alpine first, which failed on this
      # cluster because Talos nodes don't expose /proc/fs/nfsd to mount into
      # a pod (no in-kernel NFS server support reachable from here).
      containers:
        - name: nfs-server
          image: docker.io/rmohr/nfs-ganesha:latest
          env:
            - name: EXPORT_PATH
              value: /exports
          securityContext:
            capabilities:
              add: ["SYS_ADMIN", "DAC_READ_SEARCH", "SETPCAP"]
          ports:
            - containerPort: 2049
              name: nfs
            - containerPort: 111
              name: rpcbind
          volumeMounts:
            - name: backing-store
              mountPath: /exports
      volumes:
        - name: backing-store
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: capio-nfs-server
  namespace: capio-tesi-cona
spec:
  selector:
    app: capio-nfs-server
  ports:
    - name: nfs
      port: 2049
      targetPort: 2049
    - name: rpcbind
      port: 111
      targetPort: 111
